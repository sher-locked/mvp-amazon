<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Listing Eval</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body>
<header>
  <h1>Listing Eval</h1>
  <nav class="head-nav"><a href="/prompts.html">prompts</a></nav>
  <div class="spacer"></div>
  <label class="key-label" for="access-key">access key</label>
  <input type="password" id="access-key" placeholder="unset = open" autocomplete="off" size="22" />
</header>

<main>
  <div class="url-block">
    <input type="text" id="listing-input" list="known-listings" placeholder="Amazon product URL or ASIN" />
    <datalist id="known-listings"></datalist>
    <div class="url-hint">Full marketplace URL preferred — e.g. https://www.amazon.co.uk/dp/B0C4BG7R2L. A bare ASIN defaults to amazon.com. Already-scraped listings appear as suggestions.</div>
  </div>

  <article class="step" id="card-scrape">
    <div class="step-head">
      <span class="step-num">1</span>
      <span class="step-title">Scrape PDP</span>
      <span class="cost-chip" id="cost-scrape"></span>
      <span class="stale head-right" id="stale-scrape"></span>
      <span class="step-meta row" id="meta-scrape"></span>
    </div>
    <div class="step-body empty" id="out-scrape"></div>
    <div class="step-foot">
      <button class="step-btn" id="btn-scrape">Scrape (1 BrightData request)</button>
    </div>
  </article>

  <article class="step" id="card-parse">
    <div class="step-head">
      <span class="step-num">2</span>
      <span class="step-title">Parse listing</span>
      <span class="cost-chip" id="cost-parse"></span>
      <span class="stale head-right" id="stale-parse"></span>
      <span class="step-meta row" id="meta-parse"></span>
    </div>
    <div class="step-body empty" id="out-parse"></div>
    <div class="step-foot">
      <button class="step-btn" id="btn-parse">Parse stored HTML</button>
    </div>
  </article>

  <article class="step" id="card-research">
    <div class="step-head">
      <span class="step-num">3</span>
      <span class="step-title">Research SKU</span>
      <span class="cost-chip" id="cost-research"></span>
      <span class="stale head-right" id="stale-research"></span>
      <span class="step-meta row" id="meta-research"></span>
    </div>
    <div class="step-body empty" id="out-research"></div>
    <div class="step-foot">
      <button class="step-btn" id="btn-research">Run research (~1 min, web LLM)</button>
    </div>
  </article>

  <article class="step" id="card-tag">
    <div class="step-head">
      <span class="step-num">4</span>
      <span class="step-title">Bucket tags</span>
      <span class="cost-chip" id="cost-tag"></span>
      <span class="stale head-right" id="stale-tag"></span>
      <span class="step-meta row" id="meta-tag"></span>
    </div>
    <div class="step-body empty" id="out-tag"></div>
    <div class="step-foot">
      <button class="step-btn" id="btn-tag">Bucket tags (uses stored research)</button>
    </div>
  </article>

  <article class="step" id="card-generate">
    <div class="step-head">
      <span class="step-num">5</span>
      <span class="step-title">Generate listing</span>
      <span class="cost-chip" id="cost-generate"></span>
      <span class="stale head-right" id="stale-generate"></span>
      <span class="step-meta row" id="meta-generate"></span>
    </div>
    <div class="step-body empty" id="out-generate"></div>
    <div class="step-foot">
      <button class="step-btn" id="btn-generate">Generate listing (1–2 min)</button>
    </div>
  </article>

  <div class="chain-strip" id="chain-strip" hidden></div>
</main>

<script type="module">
import {
  api, esc, estCost, fmtActuals, fmtBytes, fmtDur, fmtPrompt, fmtTime, fmtTokens, fmtUsd,
  initHeader, isPromptStale, loadActivePrompts, renderGenerated, renderIdentity, renderListing,
  renderResearch, renderTags, runAction, setBtnLabel, SCRAPE_COST, STEP_ESTIMATES,
} from '/shared.js';

const $ = (id) => document.getElementById(id);
const refStr = (ref) => `${ref.marketplace}_${ref.asin}`;

// latest stored artifacts, hydrated via pure GETs — POSTs happen only on button clicks
let store = { scrape: null, parse: null, research: null, tags: null, generated: null };
let hydrateSeq = 0;

const EMPTY = {
  scrape: 'No stored scrape. “Scrape” fetches the live Amazon page via BrightData — the one step that spends a scraping request.',
  parse: 'No stored parse. “Parse” turns the stored raw HTML into a structured listing — free and local, no scraping.',
  research: 'No stored research. “Run research” resolves the SKU identity tuple and writes research notes via a web-enabled LLM (~1 min, real cost).',
  tag: 'No stored tags. “Bucket tags” sorts PDP evidence + research notes into the scope × type matrix (cheap structured-output call).',
  generate: 'No stored generation. “Generate listing” writes the four post-July-2026 fields from the stored tags in one fast-tier call.',
};

initHeader().addEventListener('change', () => hydrate());

const inputBox = $('listing-input');
inputBox.value = localStorage.getItem('lastInput') || '';
inputBox.addEventListener('input', () => localStorage.setItem('lastInput', inputBox.value));
inputBox.addEventListener('change', () => hydrate());

function requireInput() {
  const v = inputBox.value.trim();
  if (!v) {
    inputBox.focus();
    throw Object.assign(new Error('no input'), { status: 0, payload: { error: 'INPUT', message: 'Enter an Amazon URL or ASIN first.' } });
  }
  return v;
}

function showError(key, err) {
  const payload = err.payload || { error: 'NETWORK', message: String(err) };
  const head = err.status ? `HTTP ${err.status}` : 'Error';
  const out = $('out-' + key);
  out.classList.remove('empty');
  out.innerHTML = `<div class="error">${esc(head)}\n${esc(JSON.stringify(payload, null, 2))}</div>`;
}

// --- card plumbing -------------------------------------------------------------
function setCard(key, { done, meta, stale, bodyHtml, emptyText }) {
  $('card-' + key).classList.toggle('done', !!done);
  $('card-' + key).classList.remove('running');
  $('meta-' + key).textContent = meta || '';
  $('stale-' + key).textContent = stale?.length ? `${stale.join(' · ')} — re-run to apply` : '';
  const out = $('out-' + key);
  if (bodyHtml) {
    const open = [...out.querySelectorAll('details')].map((d) => d.open);
    out.innerHTML = bodyHtml;
    [...out.querySelectorAll('details')].forEach((d, i) => { if (open[i]) d.open = true; });
    out.classList.remove('empty');
  } else {
    out.textContent = emptyText;
    out.classList.add('empty');
  }
}

function setCost(key, actuals, extra) {
  const a = fmtActuals(actuals || {});
  $('cost-' + key).innerHTML =
    esc(STEP_ESTIMATES[key]) + (a ? ` · <span class="actual">${esc(a + (extra || ''))}</span>` : '');
}

function setBtn(key, label, secondary) {
  const btn = $('btn-' + key);
  setBtnLabel(btn, label);
  btn.classList.toggle('secondary', !!secondary);
}

const rawJson = (obj) =>
  `<details class="box"><summary>raw JSON</summary><pre>${esc(JSON.stringify(obj, null, 2))}</pre></details>`;

// --- card renderers --------------------------------------------------------------
function renderScrapeCard() {
  const s = store.scrape;
  if (!s) {
    setCard('scrape', { emptyText: EMPTY.scrape });
    setCost('scrape');
    setBtn('scrape', 'Scrape (1 BrightData request)', false);
    return;
  }
  const m = s.meta;
  const key = localStorage.getItem('accessKey') || '';
  const keyQ = key ? `&key=${encodeURIComponent(key)}` : '';
  const scrapeBase = `/scrape?input=${encodeURIComponent(s.ref.url)}`;
  const pageHref = `${scrapeBase}&view=html${keyQ}`;
  const htmlHref = `${scrapeBase}&include=html${keyQ}`;
  const chips = [
    `<span class="chip">${esc(m.scraper)}</span>`,
    `<span class="chip ${m.status >= 200 && m.status < 300 ? 'ok' : 'bad'}">HTTP ${esc(m.status)}</span>`,
    m.blocked
      ? `<span class="chip bad">blocked${m.blockMarker ? ' · ' + esc(m.blockMarker) : ''}</span>`
      : `<span class="chip ok">not blocked</span>`,
    m.country ? `<span class="chip">country ${esc(m.country)}</span>` : '',
    m.bytes != null ? `<span class="chip">${esc(fmtBytes(m.bytes))}</span>` : '',
    m.durationMs != null ? `<span class="chip">fetched in ${esc(fmtDur(m.durationMs))}</span>` : '',
    `<a class="chip" href="${esc(pageHref)}" target="_blank" rel="noopener noreferrer">render page ↗</a>`,
    `<a class="chip" href="${esc(htmlHref)}" target="_blank" rel="noopener noreferrer">raw HTML (JSON) ↗</a>`,
  ].filter(Boolean).join('');
  setCard('scrape', {
    done: true,
    meta: `${refStr(s.ref)} · fetched ${fmtTime(m.fetchedAt)}`,
    bodyHtml: `<div class="prov-chips">${chips}</div>` + rawJson(s),
  });
  setCost('scrape', { durationMs: m.durationMs }, SCRAPE_COST != null ? ` · ≈ ${fmtUsd(SCRAPE_COST)}` : '');
  setBtn('scrape', 'Re-scrape (new BrightData request)', true);
}

function renderParseCard() {
  const p = store.parse;
  if (!p) {
    setCard('parse', { emptyText: EMPTY.parse });
    setCost('parse');
    setBtn('parse', store.scrape ? 'Parse stored HTML' : 'Parse (no stored scrape — scrapes first · 1 BrightData request)', false);
    return;
  }
  const l = p.listing;
  // identity is RESEARCH output, never parsed from HTML — this header is a
  // view join over the stored research; until then, raw title + pending note
  const idHtml = store.research
    ? renderIdentity(store.research.identity, 'identity · from research')
    : `<div class="id-head"><div class="id-name">${esc(l.title)}</div><div class="id-pending">${esc(l.ref.marketplace)} · ${esc(l.ref.asin)} — identity pending research (step 3)</div></div>`;
  const meta = [refStr(l.ref)];
  if (l.parsedAt) meta.push(`parsed ${fmtTime(l.parsedAt)}`);
  if (l.sourceFetchedAt) meta.push(`from scrape ${fmtTime(l.sourceFetchedAt)}`);
  const stale = [];
  if (l.sourceFetchedAt && store.scrape?.meta?.fetchedAt && l.sourceFetchedAt !== store.scrape.meta.fetchedAt) {
    stale.push('made from an older scrape');
  }
  setCard('parse', { done: true, meta: meta.join(' · '), stale, bodyHtml: idHtml + renderListing(l) + rawJson(p) });
  setCost('parse');
  setBtn('parse', 'Re-parse stored HTML', true);
}

function renderResearchCard() {
  const r = store.research;
  if (!r) {
    setCard('research', { emptyText: EMPTY.research });
    setCost('research');
    setBtn('research', 'Run research (~1 min, web LLM)', false);
    return;
  }
  const meta = [refStr(r.ref), `researched ${fmtTime(r.researchedAt)}`];
  const pb = fmtPrompt(r.promptVersion);
  if (pb) meta.push(pb);
  const stale = [];
  if (isPromptStale(r.promptVersion, 'research')) stale.push('prompt changed');
  if (r.sourceParsedAt && store.parse?.listing?.parsedAt && r.sourceParsedAt !== store.parse.listing.parsedAt) {
    stale.push('made from an older parse');
  }
  setCard('research', { done: true, meta: meta.join(' · '), stale, bodyHtml: renderResearch(r) + rawJson(r) });
  setCost('research', r);
  setBtn('research', 'Re-run research (~1 min, web LLM)', true);
}

function renderTagCard() {
  const t = store.tags;
  if (!t) {
    setCard('tag', { emptyText: EMPTY.tag });
    setCost('tag');
    setBtn('tag', store.research ? 'Bucket tags (uses stored research)' : 'Bucket tags (no stored research — runs it first · ~1 min extra)', false);
    return;
  }
  const meta = [refStr(t.ref), `${t.tags.length} tags`];
  if (t.taggedAt) meta.push(`tagged ${fmtTime(t.taggedAt)}`);
  if (t.sourceResearchedAt) meta.push(`from research ${fmtTime(t.sourceResearchedAt)}`);
  const pb = fmtPrompt(t.promptVersion);
  if (pb) meta.push(pb);
  const stale = [];
  if (isPromptStale(t.promptVersion, 'tag')) stale.push('prompt changed');
  if (isPromptStale(t.researchPromptVersion, 'research')) stale.push('research prompt changed');
  if (t.sourceResearchedAt && store.research?.researchedAt && t.sourceResearchedAt !== store.research.researchedAt) {
    stale.push('made from older research');
  }
  setCard('tag', { done: true, meta: meta.join(' · '), stale, bodyHtml: renderTags(t.identity, t.tags) + rawJson(t) });
  setCost('tag', t);
  setBtn('tag', 'Re-bucket tags (uses stored research)', true);
}

function renderGenerateCard() {
  const res = store.generated;
  if (!res) {
    setCard('generate', { emptyText: EMPTY.generate });
    setCost('generate');
    setBtn('generate', store.tags ? 'Generate listing (1–2 min)' : 'Generate listing (no stored tags — runs research + tag first)', false);
    return;
  }
  const g = res.generated;
  const meta = [refStr(res.ref), `generated ${fmtTime(g.generatedAt)}`];
  if (g.sourceTaggedAt) meta.push(`from tags ${fmtTime(g.sourceTaggedAt)}`);
  const pb = fmtPrompt(g.promptVersion);
  if (pb) meta.push(pb);
  const stale = [];
  if (isPromptStale(g.promptVersion, 'generate')) stale.push('prompt changed');
  if (g.sourceTaggedAt && store.tags?.taggedAt && g.sourceTaggedAt !== store.tags.taggedAt) {
    stale.push('made from older tags');
  }
  setCard('generate', { done: true, meta: meta.join(' · '), stale, bodyHtml: renderGenerated(g) + rawJson(res) });
  setCost('generate', g);
  setBtn('generate', 'Re-run generate (1–2 min)', true);
}

// approximate spend/latency across the stored chain; "—" where stamps are missing
function renderChainStrip() {
  const el = $('chain-strip');
  if (!Object.values(store).some(Boolean)) {
    el.hidden = true;
    return;
  }
  const llm = [store.research, store.tags, store.generated?.generated].filter(Boolean);
  const stamped = llm.filter((a) => a.usage);
  let inTok = 0;
  let outTok = 0;
  let cost = 0;
  let costKnown = stamped.length > 0;
  for (const a of stamped) {
    inTok += a.usage.inputTokens;
    outTok += a.usage.outputTokens;
    const c = estCost(a.usage);
    if (c == null) costKnown = false;
    else cost += c;
  }
  const wallParts = [store.scrape?.meta, store.research, store.tags, store.generated?.generated].filter(Boolean);
  const walls = wallParts.map((a) => a.durationMs).filter((d) => d != null);
  const wall = walls.length ? walls.reduce((n, d) => n + d, 0) : null;
  const scrapes = store.scrape ? 1 : 0;
  el.innerHTML = [
    `<span class="chain-label">≈ stored chain</span>`,
    `<span>LLM artifacts stamped: <b>${stamped.length}/${llm.length}</b></span>`,
    `<span>tokens: <b>${stamped.length ? `${fmtTokens(inTok)} in / ${fmtTokens(outTok)} out` : '—'}</b></span>`,
    `<span>LLM ≈ <b>${stamped.length && costKnown ? fmtUsd(cost) : '$—'}</b></span>`,
    `<span>scrapes: <b>${scrapes}</b> ≈ <b>${scrapes && SCRAPE_COST != null ? fmtUsd(scrapes * SCRAPE_COST) : '$—'}</b></span>`,
    `<span>wall: <b>${wall != null ? fmtDur(wall) : '—'}</b>${walls.length && walls.length < wallParts.length ? ' <span>(partial)</span>' : ''}</span>`,
  ].join('');
}

function renderAll() {
  renderScrapeCard();
  renderParseCard();
  renderResearchCard();
  renderTagCard();
  renderGenerateCard();
  renderChainStrip();
}

// --- hydration: pure reads only, nothing persisted -------------------------------
async function hydrate() {
  const input = inputBox.value.trim();
  const seq = ++hydrateSeq;
  store = { scrape: null, parse: null, research: null, tags: null, generated: null };
  if (!input) {
    renderAll();
    return;
  }
  const q = encodeURIComponent(input);
  const get = (path) => api('GET', path).catch(() => null);
  const [, scrape, parse, research, tags, generated] = await Promise.all([
    loadActivePrompts(),
    get(`/scrape?input=${q}`),
    get(`/parse?input=${q}`),
    get(`/research?input=${q}`),
    get(`/tags?input=${q}`),
    get(`/generate?input=${q}`),
  ]);
  if (seq !== hydrateSeq) return; // superseded by a newer input
  store = { scrape, parse, research, tags, generated };
  renderAll();
}

// --- actions: every POST is a button click; card re-hydrates after ---------------
function bindAction(key, post) {
  const btn = $('btn-' + key);
  btn.addEventListener('click', () =>
    runAction(btn, async () => {
      try {
        const input = requireInput();
        $('card-' + key).classList.add('running');
        $('meta-' + key).textContent = 'running…';
        await post(input);
        await hydrate();
      } catch (e) {
        $('card-' + key).classList.remove('running');
        $('meta-' + key).textContent = '';
        showError(key, e);
      }
    }));
}

bindAction('scrape', (input) => api('POST', '/scrape', { input }));
bindAction('parse', (input) => api('POST', '/parse', { input }));
bindAction('research', (input) => api('POST', '/research', { input }));
bindAction('tag', (input) => api('POST', '/tags', { input }));
bindAction('generate', (input) => api('POST', '/generate', { input }));

// known-ASIN picker (stored scrapes) — optional nicety, fails silent
async function loadKnownListings() {
  try {
    const res = await api('GET', '/listings');
    $('known-listings').innerHTML = res.listings
      .map((r) => `<option value="${esc(r.url)}">${esc(`${r.marketplace}_${r.asin}`)}</option>`)
      .join('');
  } catch { /* access key missing or store empty — picker is optional */ }
}

renderAll();
if (inputBox.value.trim()) hydrate();
loadKnownListings();
</script>
</body>
</html>
